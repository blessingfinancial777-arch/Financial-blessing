<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Blessing Financiar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#070b14; --bg2:#0a1020; --card:#111a2e; --card2:#0d1526;
  --line:#1d2942; --line2:#26344f;
  --txt:#f2f6fc; --mut:#7b89a4; --mut2:#5d6b86;
  --grn:#2ee6a0; --grn-d:#12b981; --gold:#e9c46a;
  --red:#ff6b81; --orange:#f79f1f; --cyan:#00d2d3; --purple:#a55eea; --pink:#ee5a9b; --teal:#2bcbba;
  --r:16px;
}
html,body{min-height:100%}
body{
  background:var(--bg);color:var(--txt);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body.locked{overflow:hidden;height:100vh}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:#1b2540;border-radius:8px}

/* ============ PUERTA ============ */
#gate{
  position:fixed;inset:0;z-index:100;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 40%, rgba(46,230,160,.13), transparent 55%),
             radial-gradient(circle at 50% 100%, rgba(233,196,106,.08), transparent 60%),
             linear-gradient(180deg,#05080f,#0a1122 60%,#05080f);
  padding:24px;text-align:center;transition:opacity .7s ease, transform .7s ease;
}
#gate.out{opacity:0;transform:scale(1.06);pointer-events:none}
.gate-inner{max-width:380px;display:flex;flex-direction:column;align-items:center;gap:20px}
.gate-logo{
  width:86px;height:86px;border-radius:26px;display:grid;place-items:center;
  background:linear-gradient(145deg,#132a3c,#0c1a2a);border:1px solid rgba(46,230,160,.35);
  box-shadow:0 0 0 1px rgba(46,230,160,.08),0 18px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
  animation:logoFloat 3.6s ease-in-out infinite;
}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.gate-logo svg{width:42px;height:42px}
#gate h1{font-size:30px;font-weight:900;letter-spacing:.5px;line-height:1.15}
#gate h1 span{background:linear-gradient(100deg,#2ee6a0,#9ef7cd 40%,#e9c46a 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
#gate p.sub{color:var(--mut);font-size:13.5px;letter-spacing:.3px;margin-top:-10px}
#enterBtn{
  margin-top:6px;width:100%;padding:17px 26px;border-radius:15px;
  background:linear-gradient(135deg,#37e9a9,#12b981);color:#04241a;
  font-weight:800;font-size:14.5px;letter-spacing:1.6px;
  box-shadow:0 12px 34px rgba(46,230,160,.28),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .18s ease, box-shadow .25s ease, filter .2s;
}
#enterBtn:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(46,230,160,.4);filter:brightness(1.05)}
#enterBtn:active{transform:scale(.98)}
.gate-hint{font-size:11px;color:var(--mut2);letter-spacing:.6px;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.gate-hint .dotp{width:6px;height:6px;border-radius:50%;background:var(--grn);box-shadow:0 0 10px var(--grn);animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* ============ CINEMÁTICO ============ */
#cinema{position:fixed;inset:0;z-index:200;overflow:hidden;background:#000;display:grid;place-items:center;transition:opacity .9s ease, filter .9s ease, transform 1.1s ease}
#cinema.out{opacity:0;transform:scale(1.12);filter:blur(14px);pointer-events:none}
#cinema .stars{position:absolute;inset:0;overflow:hidden}
#cinema .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#cfe9ff;animation:starTwinkle 3s ease-in-out infinite}
@keyframes starTwinkle{0%,100%{opacity:.15}50%{opacity:.9}}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 48%, transparent 25%, rgba(0,0,0,.85) 78%, #000 100%)}
.portal{position:absolute;inset:0;display:grid;place-items:center}
.ring{position:absolute;border-radius:50%;border:1px solid rgba(46,230,160,.4);box-shadow:0 0 40px rgba(46,230,160,.15), inset 0 0 40px rgba(46,230,160,.07);animation:ringPulse 4.2s cubic-bezier(.22,.61,.36,1) infinite}
.ring:nth-child(1){width:210px;height:210px}
.ring:nth-child(2){width:340px;height:340px;animation-delay:1.05s;border-color:rgba(233,196,106,.32)}
.ring:nth-child(3){width:480px;height:480px;animation-delay:2.1s;border-color:rgba(46,230,160,.18)}
.ring:nth-child(4){width:640px;height:640px;animation-delay:3.15s;border-color:rgba(233,196,106,.14)}
@keyframes ringPulse{0%{transform:scale(.35);opacity:0}18%{opacity:.85}100%{transform:scale(1.65);opacity:0}}
.core{position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle, rgba(46,230,160,.5), rgba(46,230,160,.12) 45%, transparent 70%);filter:blur(14px);animation:coreBreathe 2.6s ease-in-out infinite}
@keyframes coreBreathe{0%,100%{transform:scale(.9);opacity:.6}50%{transform:scale(1.15);opacity:1}}
.halo{position:absolute;width:520px;height:520px;border-radius:50%;background:conic-gradient(from 0deg, transparent, rgba(46,230,160,.35), transparent 35%, rgba(233,196,106,.3), transparent 70%);filter:blur(38px);animation:haloSpin 12s linear infinite}
@keyframes haloSpin{to{transform:rotate(360deg)}}
.cine-wrap{position:relative;z-index:5;text-align:center;padding:0 22px;width:100%;max-width:640px}
.cine-tag{font-size:10.5px;letter-spacing:5px;color:var(--grn);text-transform:uppercase;opacity:0;margin-bottom:22px}
.cine-tag.on{animation:tagIn 1.1s ease forwards}
@keyframes tagIn{from{opacity:0;letter-spacing:9px;filter:blur(6px)}to{opacity:.95;letter-spacing:5px;filter:blur(0)}}
.cine-h1{font-size:clamp(24px,7.5vw,46px);font-weight:800;letter-spacing:1px;line-height:1.2;min-height:1.2em}
.cine-h1 .ltr{display:inline-block;opacity:0;transform:translateY(26px) rotateX(60deg);filter:blur(8px)}
.cine-h1.on .ltr{animation:ltrIn .95s cubic-bezier(.19,1,.22,1) forwards}
@keyframes ltrIn{to{opacity:1;transform:translateY(0) rotateX(0);filter:blur(0)}}
.cine-h2{
  margin-top:14px;font-size:clamp(32px,11vw,72px);font-weight:900;letter-spacing:2px;line-height:1.05;opacity:0;
  background:linear-gradient(100deg,#2ee6a0 0%,#c9ffe8 28%,#e9c46a 55%,#fff3cf 72%,#2ee6a0 100%);
  background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(46,230,160,.35));
}
.cine-h2.on{animation:titleIn 1.6s cubic-bezier(.19,1,.22,1) forwards, shine 3.4s linear 1.1s infinite}
@keyframes titleIn{from{opacity:0;transform:scale(.82) translateY(18px);filter:blur(16px) drop-shadow(0 0 0 transparent)}to{opacity:1;transform:scale(1) translateY(0);filter:blur(0) drop-shadow(0 0 26px rgba(46,230,160,.35))}}
@keyframes shine{to{background-position:250% 0}}
.cine-sub{margin-top:18px;font-size:12.5px;letter-spacing:3.4px;text-transform:uppercase;color:var(--mut);opacity:0}
.cine-sub.on{animation:subIn 1.3s ease forwards}
@keyframes subIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.cine-lines{position:absolute;left:50%;bottom:-56px;transform:translateX(-50%);display:flex;gap:7px}
.cine-lines i{width:5px;height:5px;border-radius:50%;background:rgba(46,230,160,.35)}
.cine-lines i.on{animation:ld 1.2s infinite}
@keyframes ld{0%,100%{background:rgba(46,230,160,.25);transform:scale(.8)}50%{background:var(--grn);transform:scale(1.3)}}
.flash{position:absolute;inset:0;background:#eafff7;opacity:0;pointer-events:none;z-index:8}
.flash.go{animation:flashGo 1s ease forwards}
@keyframes flashGo{0%{opacity:0}12%{opacity:.92}100%{opacity:0}}
.skip{position:absolute;right:18px;top:calc(18px + env(safe-area-inset-top));z-index:20;font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.18);border-radius:40px;padding:9px 16px;backdrop-filter:blur(8px);transition:.2s}
.skip:hover{color:#fff;border-color:rgba(46,230,160,.6);background:rgba(46,230,160,.08)}

/* ============ APP ============ */
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:40px;opacity:0;transform:scale(.97) translateY(14px);filter:blur(10px);transition:opacity 1s ease, transform 1s cubic-bezier(.19,1,.22,1), filter 1s ease}
#app.in{opacity:1;transform:none;filter:blur(0)}
#app::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 500px at 50% -10%, rgba(46,230,160,.09), transparent 60%),radial-gradient(700px 400px at 100% 110%, rgba(233,196,106,.05), transparent 60%),linear-gradient(180deg,#070b14,#0a1020 60%,#070b14)}

.topbar{display:flex;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:30;background:linear-gradient(180deg,rgba(7,11,20,.96),rgba(7,11,20,.82) 70%,transparent);backdrop-filter:blur(14px)}
.brand-mark{width:42px;height:42px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;background:linear-gradient(150deg,#12b981,#0a7f61);box-shadow:0 8px 22px rgba(46,230,160,.22),inset 0 1px 0 rgba(255,255,255,.18)}
.brand-mark svg{width:22px;height:22px}
.brand-txt{flex:1;min-width:0}
.brand-txt h1{font-size:13.5px;font-weight:800;letter-spacing:1.1px;line-height:1.25}
.brand-txt p{font-size:10.5px;color:var(--mut);letter-spacing:.2px;margin-top:2px}
.icon-btn{width:40px;height:40px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);transition:.2s}
.icon-btn:hover{border-color:var(--line2);background:#16203a}
.icon-btn:active{transform:scale(.94)}

.wrap{padding:0 16px;display:flex;flex-direction:column;gap:16px}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 14px 34px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.025)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:700;letter-spacing:1.5px;color:var(--mut);text-transform:uppercase}
.eyebrow svg{width:14px;height:14px;opacity:.9}
.mini-badge{font-size:10.5px;font-weight:800;letter-spacing:1px;padding:6px 11px;border-radius:8px;background:rgba(46,230,160,.12);color:var(--grn);border:1px solid rgba(46,230,160,.28)}
.ghost-btn{font-size:11px;font-weight:700;letter-spacing:.6px;padding:8px 12px;border-radius:9px;background:rgba(46,230,160,.09);color:var(--grn);border:1px solid rgba(46,230,160,.28);transition:.2s;display:inline-flex;align-items:center;gap:6px}
.ghost-btn:hover{background:rgba(46,230,160,.18)}
.ghost-btn:active{transform:scale(.96)}
.gold-btn{background:rgba(233,196,106,.1);color:var(--gold);border-color:rgba(233,196,106,.32)}
.gold-btn:hover{background:rgba(233,196,106,.2)}

.big-amount{font-size:clamp(30px,10vw,42px);font-weight:900;letter-spacing:-.5px;line-height:1.05;font-variant-numeric:tabular-nums}
.big-amount.pop{animation:popNum .55s cubic-bezier(.19,1,.22,1)}
@keyframes popNum{0%{transform:scale(1)}35%{transform:scale(1.055);text-shadow:0 0 26px rgba(46,230,160,.5)}100%{transform:scale(1)}}
.sub-strip{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{font-size:10.5px;color:var(--mut);background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:8px;padding:6px 10px;letter-spacing:.3px}
.chip b{color:var(--grn);font-weight:700}
.chip.gold b{color:var(--gold)}

.field{margin-bottom:11px;position:relative}
.field label{display:block;font-size:10.5px;color:var(--mut2);letter-spacing:.7px;margin-bottom:6px;text-transform:uppercase;font-weight:600}
.inp{width:100%;padding:14px 15px;border-radius:12px;font-size:14px;background:#0a1120;border:1px solid var(--line);color:var(--txt);outline:none;transition:.2s}
.inp::placeholder{color:#4d5a73}
.inp:focus{border-color:rgba(46,230,160,.6);box-shadow:0 0 0 4px rgba(46,230,160,.09)}
.inp-money{padding-left:34px}
.money-prefix{position:absolute;left:14px;bottom:15px;font-size:14px;color:var(--grn);font-weight:700;pointer-events:none}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#7b89a4 50%),linear-gradient(135deg,#7b89a4 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.btn-primary{width:100%;padding:15px;border-radius:12px;font-size:13.5px;font-weight:800;letter-spacing:.7px;background:linear-gradient(135deg,#37e9a9,#12b981);color:#04241a;box-shadow:0 10px 26px rgba(46,230,160,.26),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .16s,filter .2s,box-shadow .2s;margin-top:4px}
.btn-primary:hover{filter:brightness(1.06);box-shadow:0 14px 32px rgba(46,230,160,.36)}
.btn-primary:active{transform:scale(.98)}
.btn-soft{padding:14px;border-radius:12px;font-size:13px;font-weight:700;letter-spacing:.5px;background:#131d33;border:1px solid var(--line2);color:var(--txt);transition:.2s}
.btn-soft:hover{background:#18233c}
.btn-soft:active{transform:scale(.98)}

.donut-box{display:grid;place-items:center;position:relative;padding:10px 0 6px}
.donut{width:min(280px,74vw);height:auto;overflow:visible;filter:drop-shadow(0 8px 30px rgba(0,0,0,.45))}
.donut circle.seg{transition:stroke-dasharray .8s cubic-bezier(.19,1,.22,1), stroke-dashoffset .8s cubic-bezier(.19,1,.22,1), opacity .3s}
.donut.spin{animation:donutIn 1.1s cubic-bezier(.19,1,.22,1)}
@keyframes donutIn{from{transform:rotate(-40deg) scale(.82);opacity:0}to{transform:none;opacity:1}}
.donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:150px}
.donut-center .lbl{font-size:9.5px;letter-spacing:2.2px;color:var(--mut);text-transform:uppercase;font-weight:700}
.donut-center .val{font-size:24px;font-weight:900;margin-top:5px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.donut.donut-sm{width:min(200px,56vw)}

.cats{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.cat{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border-radius:14px;background:#0c1424;border:1px solid var(--line);transition:.25s}
.cat:hover{border-color:var(--line2);background:#0f1930}
.cat-dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 12px currentColor;margin-top:4px}
.cat-info{flex:1;min-width:0}
.cat-info .nm{font-size:13.5px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-info .as{font-size:10.5px;color:var(--mut);margin-top:3px;letter-spacing:.2px}
.cat-right{text-align:right;flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.cat-bal{font-size:13.5px;font-weight:800;color:var(--grn);font-variant-numeric:tabular-nums}
.btn-out{font-size:10px;font-weight:700;letter-spacing:.6px;padding:5px 11px;border-radius:8px;border:1px solid rgba(233,196,106,.4);color:var(--gold);background:rgba(233,196,106,.07);transition:.2s}
.btn-out:hover{background:rgba(233,196,106,.16)}
.btn-out:active{transform:scale(.95)}
.bar{height:4px;border-radius:4px;background:#0a1120;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:4px;transition:width .7s cubic-bezier(.19,1,.22,1)}

/* KPI ingresos */
.kpi-top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.kpi-big{display:flex;align-items:center;gap:9px}
.kpi-arrow{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:17px;font-weight:900;flex:0 0 auto}
.kpi-arrow.up{background:rgba(46,230,160,.14);color:var(--grn);border:1px solid rgba(46,230,160,.35)}
.kpi-arrow.down{background:rgba(255,107,129,.13);color:var(--red);border:1px solid rgba(255,107,129,.35)}
.kpi-arrow.flat{background:rgba(123,137,164,.13);color:var(--mut);border:1px solid var(--line2)}
.kpi-pct{font-size:27px;font-weight:900;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.kpi-pct.up{color:var(--grn)} .kpi-pct.down{color:var(--red)} .kpi-pct.flat{color:var(--mut)}
.kpi-label{font-size:10.5px;color:var(--mut);letter-spacing:.6px;text-transform:uppercase;font-weight:600;margin-top:3px}
.kpi-cmp{text-align:right;font-size:10.5px;color:var(--mut);line-height:1.7}
.kpi-cmp b{color:var(--txt);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:7px;height:74px;margin-top:18px}
.bars .bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .bwrap{width:100%;flex:1;display:flex;align-items:flex-end;border-radius:7px;background:rgba(255,255,255,.035)}
.bars .bfill{width:100%;border-radius:7px;background:linear-gradient(180deg,#2ee6a0,#12b981);transition:height .7s cubic-bezier(.19,1,.22,1);min-height:3px}
.bars .bcol.cur .bfill{background:linear-gradient(180deg,#f4d58d,#e9c46a)}
.bars .blbl{font-size:9px;color:var(--mut2);letter-spacing:.4px;text-transform:uppercase}
.bars .bcol.cur .blbl{color:var(--gold);font-weight:700}
.delta-line{display:flex;align-items:center;gap:10px;margin-top:16px;padding:11px 13px;border-radius:11px;background:#0a1120;border:1px solid var(--line);font-size:11.5px;color:var(--mut)}
.delta-line b{color:var(--txt)}
.delta-line .pill{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:7px;flex:0 0 auto}
.pill.up{background:rgba(46,230,160,.14);color:var(--grn)}
.pill.down{background:rgba(255,107,129,.14);color:var(--red)}
.pill.flat{background:rgba(123,137,164,.14);color:var(--mut)}

/* Estilo de vida chip card */
.life-hero{display:flex;align-items:center;gap:14px}
.life-ico{width:52px;height:52px;border-radius:16px;flex:0 0 auto;display:grid;place-items:center;font-size:25px;background:linear-gradient(150deg,#16233c,#0d1728);border:1px solid var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.life-txt{flex:1;min-width:0}
.life-txt b{display:block;font-size:15px;font-weight:800;letter-spacing:.2px}
.life-txt small{display:block;font-size:11px;color:var(--mut);margin-top:3px}
.pct-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:15px}
.pct-pill{font-size:10px;font-weight:700;padding:5px 9px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--mut);display:flex;align-items:center;gap:6px}
.pct-pill i{width:7px;height:7px;border-radius:50%;display:block;box-shadow:0 0 8px currentColor}
.card-actions{display:flex;gap:10px;margin-top:16px}
.card-actions button{flex:1}

/* Planes */
.plan{position:relative;padding:14px;border-radius:14px;background:#0c1424;border:1px solid var(--line);transition:.25s;margin-bottom:10px}
.plan:hover{border-color:var(--line2);background:#0f1930}
.plan.done{border-color:rgba(46,230,160,.45);background:rgba(46,230,160,.05)}
.plan-top{display:flex;align-items:center;gap:12px}
.plan-ico{width:42px;height:42px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;font-size:20px;background:#111d33;border:1px solid var(--line2)}
.plan-nm{flex:1;min-width:0}
.plan-nm b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan-nm small{display:block;font-size:10.5px;color:var(--mut);margin-top:3px}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.7px;padding:4px 8px;border-radius:7px;text-transform:uppercase;flex:0 0 auto}
.tag.grande{background:rgba(165,94,234,.15);color:#c79cff;border:1px solid rgba(165,94,234,.35)}
